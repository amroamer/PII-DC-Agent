server {
    listen 80;
    server_name piidc.uaenorth.cloudapp.azure.com;

    # Allow request bodies up to the app's 50MB multer limit.
    # WITHOUT this, nginx applies its built-in 1MB default and rejects any
    # upload over 1MB with HTTP 413 before it ever reaches the app — which
    # silently breaks PDF / larger-file uploads on the Import Test page.
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts so large uploads aren't cut off mid-transfer.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
